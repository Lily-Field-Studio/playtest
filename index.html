async function open(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(D)));}
async function go(pw,quiet){const m=document.getElementById('m');if(!quiet)m.textContent='Opening…';

catch(e){if(!quiet)m.textContent=crypto.subtle?'Wrong password.':'This page needs a secure (https) address.';}}
